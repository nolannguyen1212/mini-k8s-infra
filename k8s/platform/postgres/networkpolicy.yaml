apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:
  name: postgres-allow-from-miniflux
  namespace: platform

spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: miniflux }
      ports:
        - port: 5432
