apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: root
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/nolannguyen1212/mini-k8s-infra.git
    targetRevision: master
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
